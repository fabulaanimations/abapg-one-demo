<style>

.user{display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 20px rgba(213,43,189,.28)}

.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:700;transition:.18s transform,.18s box-shadow}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 22px rgba(213,43,189,.22)}.btn.success{background:var(--ok);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.light{background:#f6edf4;color:#171717}.btn.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.miniActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:29px;font-weight:800;margin-top:8px}.kpi .sub{margin-top:10px;color:var(--muted);font-size:13px}
.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:13px}.geo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#faf5f9;border:1px solid #efd7eb;border-radius:12px;padding:10px;margin-top:12px;color:#453b43}.hero .geo{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:#ede1eb}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;color:#5b544a;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #e3cde0;border-radius:12px;padding:11px;background:white}.field textarea{min-height:95px}
.sectionTitle{margin-bottom:18px}.sectionTitle h2{margin:0;font-size:30px}.sectionTitle p{margin:5px 0 0;color:var(--muted)}
.notice{background:white;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;padding:14px;margin:12px 0}.room{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}

.splitPanel{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.featureList{display:grid;gap:12px}.feature{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.feature:last-child{border-bottom:0}.featureIcon{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:#741d69;font-weight:800}

.mobilebar{display:none}
@media(max-width:1120px){.app{grid-template-columns:270px 1fr}.g4,.g3{grid-template-columns:repeat(2,1fr)}.heroSplit,.splitPanel{grid-template-columns:1fr}}
@media(max-width:780px){.app{display:block}.sidebar{display:none}.top{height:auto;padding:16px 18px}.content{padding:18px 14px 92px}.g2,.g3,.g4,.quick{grid-template-columns:1fr}.sectionTitle h2{font-size:24px}.heroSplit{grid-template-columns:1fr}.mobilebar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:12;padding:8px 5px max(8px,env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;font-size:10px;padding:6px 2px;color:#5d5a54}.mobilebar span{display:block;font-size:18px}.user .name{display:none}.qrSvg{width:190px;height:190px}}

/* ABAPG official-content integration */
.officialGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.officialSource{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
.officialSource:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(53,114,85,.10)}
.officialLive{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.officialLive h1,.officialLive h2,.officialLive h3,.officialLive h4{margin:16px 0 8px;line-height:1.2}
.officialLive p,.officialLive li{line-height:1.55}

.officialLive th,.officialLive td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.officialLive a{color:var(--accent-2);font-weight:700;text-decoration:underline}

/* ===== ABAPG ONE PREMIUM CONCEPT v6 ===== */
:root{

  --premium-charcoal:#1a181c;

.premiumHero{position:relative;min-height:430px;border-radius:28px;overflow:hidden;background:#111;color:#fff;box-shadow:0 22px 60px rgba(0,0,0,.16)}

<script>

function qrSVG(seed='ABAPG-QR'){const size=29; let cells=''; for(let y=0;y<size;y++){ for(let x=0;x<size;x++){ let finder=(x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21); let border=(x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20); let on=false; if(finder){ on = (x===0||x===6||y===0||y===6||((x>=2&&x<=4)&&(y>=2&&y<=4))); } else if(border){ on=false; } else { let v=(x*y + x + y + seed.length + seed.charCodeAt((x+y)%seed.length))%7; on=(v===0||v===2||v===4); } if(on) cells += `<rect x="${x*8}" y="${y*8}" width="8" height="8" rx="1.1" fill="#111"/>`; }} return `<svg class="qrSvg" viewBox="0 0 232 232" xmlns="http://www.w3.org/2000/svg"><rect width="232" height="232" rx="14" fill="#fff"/>${cells}<rect x="88" y="88" width="56" height="56" rx="12" fill="#d52bbd"/><text x="116" y="121" text-anchor="middle" font-size="16" font-family="Arial" fill="#fff" font-weight="700">ABA</text></svg>`; }

function officialLink(key,label){

function ensureMenu(role,item,index){
  if(!menus[role].some(x=>x[0]===item[0])){
    menus[role].splice(Math.min(index,menus[role].length),0,item);
  }
}

function sanitizeOfficialHtml(rendered){
  const box=document.createElement('div');
  box.innerHTML=rendered||'';
  box.querySelectorAll('script,style,iframe,form,input,button,video,audio,canvas,svg,noscript').forEach(el=>el.remove());
  box.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      if(el.tagName==='A' && attr.name==='href') return;
      el.removeAttribute(attr.name);
    });
  });
  box.querySelectorAll('a').forEach(a=>{
    try{
      a.href=new URL(a.getAttribute('href')||'', 'https://www.abaperugia.com/').href;
      a.target='_blank';
      a.rel='noopener';
    }catch(e){}
  });
  return box.innerHTML;
}

async function loadOfficialPage(key,target){
  const source=officialSources[key];
  if(!source || !source.slug) return;
  target.innerHTML='<div class="officialLoading">Caricamento contenuto ufficiale da abaperugia.com…</div>';
  const api='https://www.abaperugia.com/wp-json/wp/v2/pages?slug='+encodeURIComponent(source.slug)+'&_fields=title,content,modified,link';
  try{
    const response=await fetch(api,{mode:'cors',cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!Array.isArray(data) || !data.length) throw new Error('Contenuto non trovato');
    const page=data[0];
    target.innerHTML=
      '<div class="officialSource">Aggiornato dal sito istituzionale'+(page.modified?' • '+new Date(page.modified).toLocaleDateString('it-IT'):'')+'</div>'+
      '<div class="officialLive">'+sanitizeOfficialHtml(page.content && page.content.rendered)+'</div>'+
      '<div style="margin-top:16px">'+officialLink(key,'Apri pagina originale')+'</div>';
  }catch(err){
    target.innerHTML=
      '<div class="officialFallback"><b>Il contenuto live non è disponibile in questo momento.</b>'+
      '<p class="sub">Puoi comunque aprire la fonte ufficiale aggiornata.</p>'+
      officialLink(key,'Apri su abaperugia.com')+'</div>';
  }
}
function hydrateOfficialContent(){
  document.querySelectorAll('[data-official-key]').forEach(el=>{
    if(el.dataset.loaded==='1') return;
    el.dataset.loaded='1';
    loadOfficialPage(el.dataset.officialKey,el);
  });
}

/* Aggiornamento PWA: pulisce una volta la vecchia cache, utile dopo la sostituzione di index.html */
window.addEventListener('load',async()=>{
  if(localStorage.getItem('abapg_official_version')!==ABAPG_OFFICIAL_VERSION){
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.indexOf('abapg-one')===0).map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
        setTimeout(()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}),800);
      }
      localStorage.setItem('abapg_official_version',ABAPG_OFFICIAL_VERSION);
    }catch(e){}
  }else if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
});
